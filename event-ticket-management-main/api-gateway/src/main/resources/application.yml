server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:eventified-default-secret-change-in-production-32chars}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: oauth2-authorization
          uri: http://localhost:8085
          predicates:
            - Path=/oauth2/**
        - id: auth-google
          uri: http://localhost:8085
          predicates:
            - Path=/auth/google/**
        - id: login-oauth2
          uri: http://localhost:8085
          predicates:
            - Path=/login/oauth2/**
        - id: event-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/events/**
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
