spring.application.name=booking-service
server.port=8083

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookings_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

# Direct Feign URLs (bypass Eureka for services that dont register)
spring.cloud.openfeign.client.config.event-service.url=http://localhost:8082
spring.cloud.openfeign.client.config.user-service.url=http://localhost:8085

# Feign timeout config — prevent Feign from hanging and causing upstream 503s
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Enable Feign circuit-breaker so fallback classes are invoked on 503 / connection errors
spring.cloud.openfeign.circuitbreaker.enabled=true

