spring.datasource.url=jdbc:h2:mem:userservicetest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# JWT stub values for tests (must be >= 32 chars for HMAC-SHA256)
jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256
jwt.expiration-ms=3600000

# Stub OAuth2 client registration to satisfy auto-configuration
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
